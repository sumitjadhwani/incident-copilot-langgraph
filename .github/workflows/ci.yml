name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # nightly evals

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit + Postgres integration tests (deterministic, no LLM)
        run: uv run pytest

  evals:
    # LLM evals against mocked tools: on demand and nightly, not on every push.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: test
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Scenario evals (3 runs each)
        run: uv run python scripts/run_evals.py --runs 3 --threshold 0.66
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval-results/
