# MCP tool servers. They verify the caller's Keycloak token and impersonate the caller in Kubernetes.
# host.docker.internal reaches Keycloak (JWKS) and Jaeger (OTLP) running in docker-compose on the host.
apiVersion: v1
kind: ConfigMap
metadata: {name: mcp-common, namespace: copilot-system}
data:
  KEYCLOAK_ISSUER: "http://localhost:8080/realms/incident-copilot"
  KEYCLOAK_JWKS_URL: "http://host.docker.internal:8080/realms/incident-copilot/protocol/openid-connect/certs"
  MCP_AUDIENCE: "copilot-mcp"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4318"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mcp-k8s-read, namespace: copilot-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: mcp-k8s-read}}
  template:
    metadata: {labels: {app: mcp-k8s-read}}
    spec:
      serviceAccountName: mcp-k8s-read
      containers:
        - name: server
          image: copilot-mcp:dev
          imagePullPolicy: Never
          command: ["python", "-m", "mcp_servers.k8s_read"]
          envFrom: [{configMapRef: {name: mcp-common}}]
          env: [{name: MCP_PUBLIC_URL, value: "http://localhost:30082"}]
          ports: [{containerPort: 8000}]
          resources: {requests: {cpu: 20m, memory: 96Mi}, limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: mcp-k8s-read, namespace: copilot-system}
spec:
  type: NodePort
  selector: {app: mcp-k8s-read}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30082}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mcp-k8s-write, namespace: copilot-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: mcp-k8s-write}}
  template:
    metadata: {labels: {app: mcp-k8s-write}}
    spec:
      serviceAccountName: mcp-k8s-write
      containers:
        - name: server
          image: copilot-mcp:dev
          imagePullPolicy: Never
          command: ["python", "-m", "mcp_servers.k8s_write"]
          envFrom: [{configMapRef: {name: mcp-common}}]
          env: [{name: MCP_PUBLIC_URL, value: "http://localhost:30083"}]
          ports: [{containerPort: 8000}]
          resources: {requests: {cpu: 20m, memory: 96Mi}, limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: mcp-k8s-write, namespace: copilot-system}
spec:
  type: NodePort
  selector: {app: mcp-k8s-write}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30083}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mcp-observability, namespace: copilot-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: mcp-observability}}
  template:
    metadata: {labels: {app: mcp-observability}}
    spec:
      serviceAccountName: mcp-observability
      automountServiceAccountToken: false
      containers:
        - name: server
          image: copilot-mcp:dev
          imagePullPolicy: Never
          command: ["python", "-m", "mcp_servers.observability"]
          envFrom: [{configMapRef: {name: mcp-common}}]
          env:
            - {name: MCP_PUBLIC_URL, value: "http://localhost:30081"}
            - {name: PROMETHEUS_URL, value: "http://prometheus.monitoring.svc:9090"}
          ports: [{containerPort: 8000}]
          resources: {requests: {cpu: 20m, memory: 96Mi}, limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: mcp-observability, namespace: copilot-system}
spec:
  type: NodePort
  selector: {app: mcp-observability}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30081}]
