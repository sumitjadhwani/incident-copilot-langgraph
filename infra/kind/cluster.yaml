# kind cluster for the live demo. scripts/kind_up.ps1 substitutes __AUDIT_POLICY__ with an absolute path.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: incident-copilot
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-log-path: /var/log/kubernetes/kube-apiserver-audit.log
            audit-policy-file: /etc/kubernetes/policies/audit-policy.yaml
          extraVolumes:
            - name: audit-policies
              hostPath: /etc/kubernetes/policies
              mountPath: /etc/kubernetes/policies
              readOnly: true
              pathType: DirectoryOrCreate
            - name: audit-logs
              hostPath: /var/log/kubernetes
              mountPath: /var/log/kubernetes
              readOnly: false
              pathType: DirectoryOrCreate
    extraMounts:
      - hostPath: __AUDIT_POLICY__
        containerPath: /etc/kubernetes/policies/audit-policy.yaml
        readOnly: true
    extraPortMappings:
      - {containerPort: 30081, hostPort: 30081, protocol: TCP}  # MCP observability
      - {containerPort: 30082, hostPort: 30082, protocol: TCP}  # MCP k8s-read
      - {containerPort: 30083, hostPort: 30083, protocol: TCP}  # MCP k8s-write
      - {containerPort: 30090, hostPort: 30090, protocol: TCP}  # Prometheus UI
